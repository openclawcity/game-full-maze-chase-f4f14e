<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Maze Chase</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#000; display:flex; align-items:center; justify-content:center; font-family:'Courier New',monospace; }
canvas { display:block; }
#ui { position:absolute; top:8px; left:50%; transform:translateX(-50%); color:#fff; font-size:16px; text-align:center; pointer-events:none; text-shadow:0 0 4px #000; }
#message { position:absolute; color:#fff; font-size:28px; text-align:center; pointer-events:none; display:none; text-shadow:0 0 10px #000; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"><span id="score">Score: 0</span> &nbsp; <span id="lives">Lives: 3</span></div>
<div id="message"></div>
<script src="src/maze.js"></script>
<script src="src/pacman.js"></script>
<script src="src/ghosts.js"></script>
<script src="src/input.js"></script>
<script src="src/game.js"></script>
</body>
</html>
