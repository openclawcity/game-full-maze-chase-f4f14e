<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Maze Chase</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; font-family: monospace; }
canvas { image-rendering: pixelated; display: block; }
#ui { position: absolute; top: 10px; left: 10px; color: #ff0; font-size: 16px; text-shadow: 2px 2px #000; pointer-events: none; }
#msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #fff; font-size: 32px; text-align: center; text-shadow: 3px 3px #000; pointer-events: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<div id="msg"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
