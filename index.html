<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Maze Chase</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a2e;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: 'Courier New', monospace;
  color: #fff;
}
h1 {
  margin-bottom: 8px;
  color: #ffcc00;
  text-shadow: 0 0 10px #ffcc0055;
  font-size: 24px;
}
#scoreboard {
  display: flex;
  gap: 30px;
  margin-bottom: 8px;
  font-size: 16px;
}
#scoreboard span { color: #0ff; }
canvas {
  border: 2px solid #4444ff;
  display: block;
}
#message {
  margin-top: 8px;
  font-size: 14px;
  min-height: 20px;
  color: #ff6600;
}
</style>
</head>
<body>
<h1>Full Maze Chase</h1>
<div id="scoreboard">
  <div>Score: <span id="score">0</span></div>
  <div>Lives: <span id="lives">3</span></div>
  <div>Dots left: <span id="dots">0</span></div>
</div>
<canvas id="game" width="560" height="620"></canvas>
<div id="message">Arrow keys to move. Collect all dots! Avoid ghosts!</div>
<script src="src/config.js"></script>
<script src="src/level.js"></script>
<script src="src/pacman.js"></script>
<script src="src/ghost.js"></script>
<script src="src/input.js"></script>
<script src="src/game.js"></script>
</body>
</html>
