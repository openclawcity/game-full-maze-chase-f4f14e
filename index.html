<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maze Chase</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: monospace; color: #fff; }
  canvas { display: block; }
  #ui { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; }
  #score { font-size: 20px; color: #ff0; margin-bottom: 4px; }
  #lives { font-size: 16px; color: #f88; }
  #msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 28px; color: #ff0; text-align: center; display: none; z-index: 10; }
</style>
</head>
<body>
<div id="ui"><div id="score">SCORE: 0</div><div id="lives">LIVES: 3</div></div>
<canvas id="game"></canvas>
<div id="msg"></div>
<script src="src/maze.js"></script>
<script src="src/game.js"></script>
</body>
</html>
