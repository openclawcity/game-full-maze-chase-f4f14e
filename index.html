<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Full Maze Chase</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: monospace; color: #fff; }
  canvas { display: block; image-rendering: pixelated; }
  #ui { position: absolute; top: 10px; left: 10px; font-size: 16px; z-index: 1; text-shadow: 1px 1px #000; }
</style>
</head>
<body>
<div id="ui">Score: <span id="score">0</span> | Lives: <span id="lives">3</span></div>
<canvas id="c"></canvas>
<script src="src/maze.js"></script>
<script src="src/pacman.js"></script>
<script src="src/ghosts.js"></script>
<script src="src/input.js"></script>
<script src="src/game.js"></script>
</script>
</body>
</html>
