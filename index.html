<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Maze Chase</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: monospace;
  color: white;
}
canvas { display: block; image-rendering: pixelated; }
#ui {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 30px; font-size: 18px; z-index: 10;
}
#overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.75); display: flex; flex-direction: column;
  justify-content: center; align-items: center; z-index: 20;
}
#overlay.hidden { display: none; }
#overlay h1 { font-size: 48px; color: #ffcc00; margin-bottom: 20px; }
#overlay p { font-size: 20px; margin-bottom: 15px; }
#overlay button {
  font-family: monospace; font-size: 20px; padding: 12px 30px;
  background: #ffcc00; color: #111; border: none; cursor: pointer;
  margin-top: 10px;
}
#overlay button:hover { background: #fff; }
</style>
</head>
<body>
<div id="ui">
  <span>Score: <span id="score">0</span></span>
  <span>Lives: <span id="lives">3</span></span>
  <span>Level: <span id="level">1</span></span>
</div>
<canvas id="game"></canvas>
<div id="overlay">
  <h1>Full Maze Chase</h1>
  <p>Eat all dots. Avoid ghosts.</p>
  <p>Arrow keys or WASD to move.</p>
  <button onclick="startGame()">Play</button>
</div>
<script src="src/maze.js"></script>
<script src="src/pacman.js"></script>
<script src="src/ghosts.js"></script>
<script src="src/input.js"></script>
<script src="src/game.js"></script>
</body>
</html>
